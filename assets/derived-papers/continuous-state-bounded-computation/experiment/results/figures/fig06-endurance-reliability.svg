<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Sparse maintenance repair and latency</title>
<desc id="desc">Error repair counts and semantic transition latency quantiles.</desc>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#172033}.small{font-size:13px;fill:#667085}.tick{font-size:12px;fill:#667085}.label{font-size:14px;font-weight:600}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#667085}</style>
<rect width="1100" height="600" fill="#FFFFFF"/>
<text x="52.00" y="42.00" text-anchor="start" font-size="14" font-weight="400" class="title">Persistent state repairs most errors—but not in 140 ms</text>
<text x="52.00" y="66.00" text-anchor="start" font-size="14" font-weight="400" class="subtitle">Error episodes are lifecycle counts; latency is measured CPU model time per semantic transition.</text>
<rect x="55.00" y="105.00" width="460.00" height="410.00" fill="#F7F9FC" stroke="#E4E9F0" stroke-width="1" rx="10" opacity="1"/>
<text x="71.00" y="131.00" text-anchor="start" font-size="15" font-weight="700">A  Semantic error lifecycle</text>
