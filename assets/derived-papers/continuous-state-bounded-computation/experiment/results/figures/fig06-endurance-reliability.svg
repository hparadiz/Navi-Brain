<text x="566.00" y="131.00" text-anchor="start" font-size="15" font-weight="700">B  Transition latency</text>
<text x="285.00" y="205.00" text-anchor="middle" font-size="54" font-weight="700" style="fill:#059669">944</text>
<text x="285.00" y="235.00" text-anchor="middle" font-size="15" font-weight="600">of 946 observed episodes repaired</text>
<rect x="105.00" y="285.00" width="360.00" height="34.00" fill="#E5E7EB" stroke="none" stroke-width="1" rx="7" opacity="1"/>
<rect x="105.00" y="285.00" width="359.24" height="34.00" fill="#059669" stroke="none" stroke-width="1" rx="7" opacity="1"/>
<text x="285.00" y="307.00" text-anchor="middle" font-size="14" font-weight="700" style="fill:#FFFFFF">99.79%</text>
