<text x="105.00" y="408.00" text-anchor="start" font-size="14" font-weight="400">Error-state occupancy: 20.153%</text>
<text x="105.00" y="433.00" text-anchor="start" font-size="14" font-weight="400">Final presence fields wrong: 2 of 2</text>
