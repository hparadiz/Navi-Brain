<text x="185.00" y="228.00" text-anchor="middle" font-size="17" font-weight="700">Event + delta bus</text>
<text x="185.00" y="254.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">timestamped evidence</text>
<rect x="400.00" y="105.00" width="320.00" height="105.00" fill="#EDE9FE" stroke="#AAB4C3" stroke-width="1.2" rx="12" opacity="1"/>
<text x="560.00" y="143.00" text-anchor="middle" font-size="17" font-weight="700">Temporal kernel</text>
<text x="560.00" y="169.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">admit · defer · cancel · arbitrate</text>
<rect x="400.00" y="280.00" width="320.00" height="120.00" fill="#DCFCE7" stroke="#AAB4C3" stroke-width="1.2" rx="12" opacity="1"/>
<text x="560.00" y="318.00" text-anchor="middle" font-size="17" font-weight="700">Persistent cognitive state</text>
<text x="560.00" y="344.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">self · world · social · goals · uncertainty</text>
<rect x="805.00" y="190.00" width="220.00" height="90.00" fill="#FEF3C7" stroke="#AAB4C3" stroke-width="1.2" rx="12" opacity="1"/>
<text x="915.00" y="228.00" text-anchor="middle" font-size="17" font-weight="700">Neural transition service</text>
<text x="915.00" y="254.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">bounded semantic jobs</text>
<rect x="805.00" y="390.00" width="220.00" height="90.00" fill="#FCE7F3" stroke="#AAB4C3" stroke-width="1.2" rx="12" opacity="1"/>
<text x="915.00" y="428.00" text-anchor="middle" font-size="17" font-weight="700">Action + speech</text>
<text x="915.00" y="454.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">small revocable commitments</text>
<rect x="90.00" y="390.00" width="190.00" height="90.00" fill="#E5E7EB" stroke="#AAB4C3" stroke-width="1.2" rx="12" opacity="1"/>
<text x="185.00" y="428.00" text-anchor="middle" font-size="17" font-weight="700">Durable memory</text>
<text x="185.00" y="454.00" text-anchor="middle" font-size="13" font-weight="400" style="fill:#667085">episodic log · consolidation</text>
