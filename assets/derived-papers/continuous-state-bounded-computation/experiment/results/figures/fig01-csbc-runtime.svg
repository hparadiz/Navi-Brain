<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">CSBC runtime architecture</title>
<desc id="desc">Persistent state is separate from executing cognition and temporal control.</desc>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#172033}.small{font-size:13px;fill:#667085}.tick{font-size:12px;fill:#667085}.label{font-size:14px;font-weight:600}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#667085}</style>
<rect width="1120" height="650" fill="#FFFFFF"/>
<text x="52.00" y="42.00" text-anchor="start" font-size="14" font-weight="400" class="title">CSBC runtime: state persists while control recurs</text>
<text x="52.00" y="66.00" text-anchor="start" font-size="14" font-weight="400" class="subtitle">The temporal kernel arbitrates bounded work; model execution is a transition service, not the process itself.</text>
<rect x="55.00" y="100.00" width="1010.00" height="470.00" fill="#F8FAFD" stroke="#D7DEE9" stroke-width="1" rx="18" opacity="1"/>
