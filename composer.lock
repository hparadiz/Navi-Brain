            "name": "divergence/divergence",
            "version": "dev-develop",
            "dist": {
                "type": "path",
                "url": "../../Divergence/framework",
                "reference": "cd106c423e317b49e7343d8076f27e73fb6272fb"
            },
            "require": {
                "filp/whoops": "*",
                "guzzlehttp/psr7": "^2.0",
                "php": ">=8.1",
                "psr/http-message": "^2.0",
                "psr/http-server-handler": "^1.0",
                "symfony/var-dumper": "*",
                "twig/extra-bundle": "^3.0",
                "twig/twig": "*"
            },
            "require-dev": {
                "fakerphp/faker": "^1.20",
                "friendsofphp/php-cs-fixer": "*",
                "mikey179/vfsstream": "^1.6",
                "phpunit/phpcov": "^12.0",
                "phpunit/phpunit": "^13.0"
            },
            "suggest": {
                "divergence/cli": "Lets you initialize a new project as well as create, edit, and test database configurations via CLI."
            },
            "type": "project",
            "autoload": {
                "psr-4": {
                    "Divergence\\": "src"
                }
            },
            "autoload-dev": {
                "psr-4": {
                    "Divergence\\Tests\\": "tests/Divergence",
                    "Divergence\\Tests\\MockSite\\": "tests/MockSite"
                }
            },
            "scripts": {
                "fix-code": [
                    "php-cs-fixer fix"
                ],
                "test": [
                    "@test:mysql",
                    "@test:sqlite",
                    "@test:pgsql"
                ],
                "test:coverage": [
                    "@test:mysql:coverage",
                    "@test:sqlite:coverage",
                    "@test:pgsql:coverage",
                    "@coverage:merge"
                ],
                "test:mysql": [
                    "DIVERGENCE_TEST_DB=tests-mysql vendor/bin/phpunit"
                ],
                "test:sqlite": [
                    "DIVERGENCE_TEST_DB=tests-sqlite-memory vendor/bin/phpunit"
                ],
                "test:pgsql": [
                    "DIVERGENCE_TEST_DB=tests-pgsql vendor/bin/phpunit"
                ],
                "test:mysql:coverage": [
                    "mkdir -p build/coverage build/logs && XDEBUG_MODE=coverage DIVERGENCE_TEST_DB=tests-mysql vendor/bin/phpunit --coverage-php build/coverage/mysql.cov"
                ],
                "test:sqlite:coverage": [
                    "mkdir -p build/coverage build/logs && XDEBUG_MODE=coverage DIVERGENCE_TEST_DB=tests-sqlite-memory vendor/bin/phpunit --coverage-php build/coverage/sqlite.cov"
                ],
                "test:pgsql:coverage": [
                    "mkdir -p build/coverage build/logs && XDEBUG_MODE=coverage DIVERGENCE_TEST_DB=tests-pgsql vendor/bin/phpunit --coverage-php build/coverage/pgsql.cov"
                ],
                "coverage:merge": [
                    "vendor/bin/phpcov merge --clover build/logs/clover.xml build/coverage"
                ]
            },
            "license": [
                "MIT"
            ],
            "authors": [
                {
